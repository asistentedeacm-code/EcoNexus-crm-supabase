<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoNexus - Panel Agentes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Modal Autenticación Segura -->
  <div id="modalAuth" class="fixed inset-0 bg-slate-950/95 backdrop-blur-md z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-8 shadow-2xl text-center space-y-6">
      <div class="space-y-2">
        <h2 class="text-3xl font-black text-emerald-400 tracking-tight">EcoNexus</h2>
        <p class="text-xs text-slate-400">Panel Exclusivo de Agentes Autenticados</p>
      </div>
      <button id="btnGoogleLogin" class="w-full bg-white hover:bg-slate-200 text-slate-900 font-bold py-3.5 px-4 rounded-xl transition-all flex items-center justify-center gap-3 text-sm shadow-lg active:scale-95">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continuar con Google
      </button>
    </div>
  </div>

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md p-4 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-black text-emerald-400">EcoNexus <span class="text-xs font-normal text-slate-400">| Panel Agentes</span></h1>
      <div class="flex items-center gap-4">
        <span id="userInfo" class="text-xs font-mono text-slate-400 hidden bg-slate-950 px-2.5 py-1 rounded-lg border border-slate-800"></span>
        <button id="btnCerrarSesion" class="hidden text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 border border-red-500/20 px-3 py-1.5 rounded-lg transition active:scale-95">Salir</button>
        <a href="index.html" class="text-xs text-slate-400 hover:text-emerald-400 transition flex items-center gap-1">← Catálogo</a>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-5xl mx-auto p-4 space-y-8 mt-4">
    <!-- Formulario Captación -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-6">
      <div class="border-b border-slate-800/80 pb-4">
        <h2 class="text-xl font-bold text-slate-100">Publicar Inmueble</h2>
        <p class="text-xs text-slate-400 mt-0.5">Las imágenes se procesan localmente a WebP para maximizar la velocidad y ahorrar almacenamiento.</p>
      </div>

      <form id="formInmueble" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="titulo" class="block text-xs font-semibold text-slate-400 mb-1">Título del Inmueble *</label>
            <input type="text" id="titulo" placeholder="Ej: Apartamento Moderno en El Bosque" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-emerald-500 transition">
          </div>
          <div>
            <label for="precio" class="block text-xs font-semibold text-slate-400 mb-1">Precio ($ USD) *</label>
            <input type="number" id="precio" step="0.01" min="0" placeholder="Ej: 85000" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-emerald-500 transition">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label for="tipo_operacion" class="block text-xs font-semibold text-slate-400 mb-1">Tipo de Operación *</label>
            <select id="tipo_operacion" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-emerald-500 transition cursor-pointer">
              <option value="Venta">Venta</option>
              <option value="Alquiler">Alquiler</option>
            </select>
          </div>
          <div>
            <label for="ubicacion" class="block text-xs font-semibold text-slate-400 mb-1">Ubicación *</label>
            <input type="text" id="ubicacion" placeholder="Ej: Valencia, Carabobo" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-emerald-500 transition">
          </div>
        </div>

        <!-- Características adicionales -->
        <div class="grid grid-cols-3 gap-4">
          <div>
            <label for="habitaciones" class="block text-xs font-semibold text-slate-400 mb-1">Habitaciones</label>
            <input type="number" id="habitaciones" min="0" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-emerald-500 transition">
          </div>
          <div>
            <label for="banos" class="block text-xs font-semibold text-slate-400 mb-1">Baños</label>
            <input type="number" id="banos" min="0" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-emerald-500 transition">
          </div>
          <div>
            <label for="estacionamientos" class="block text-xs font-semibold text-slate-400 mb-1">Estacionam.</label>
            <input type="number" id="estacionamientos" min="0" value="1" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm text-slate-200 outline-none focus:border-emerald-500 transition">
          </div>
        </div>

        <div>
          <label for="inputFotos" class="block text-xs font-semibold text-slate-400 mb-1">Fotos del Inmueble (Máximo 5 imágenes) *</label>
          <input type="file" id="inputFotos" accept="image/*" multiple required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-emerald-500/10 file:text-emerald-400 hover:file:bg-emerald-500/20 cursor-pointer">
        </div>

        <button type="submit" id="btnSubmit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3.5 rounded-xl transition-all shadow-lg shadow-emerald-500/10 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
          📤 Comprimir, Subir y Publicar
        </button>
      </form>
    </section>

    <!-- Lista Mis Inmuebles -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800/80 pb-3">
        <h3 class="text-lg font-bold text-slate-100">Mis Inmuebles Publicados</h3>
        <span class="text-[10px] bg-slate-950 border border-slate-800 text-slate-400 px-2.5 py-1 rounded-full">Filtrado por RLS</span>
      </div>
      <div id="listaMisInmuebles" class="space-y-3">
        <div class="text-center py-6 text-slate-500 text-sm">Verificando sesión y permisos...</div>
      </div>
    </section>
  </main>

  <script>
    // Inicialización del cliente Supabase
    const SUPABASE_URL = 'https://gvcklmqldswxfweliuio.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Yu3I-FpcjU44dHsPs9pPDQ_9TEC9fKa';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let usuarioActual = null;

    // Helper Anti-XSS
    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[match]);
    }

    // Login & Logout
    async function loginGoogle() { 
      await db.auth.signInWithOAuth({ 
        provider: 'google', 
        options: { redirectTo: window.location.origin + '/index_captacion.html' }
      }); 
    }

    async function logout() { 
      await db.auth.signOut(); 
      window.location.reload(); 
    }

    // Motor de compresión optimizado a WebP
    async function comprimirImagenWebP(file, maxWidth = 1200, quality = 0.80) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith('image/')) {
          return reject(new Error('El archivo no es una imagen válida.'));
        }
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { 
              h = Math.round((h * maxWidth) / w); 
              w = maxWidth; 
            }
            canvas.width = w; 
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);
            
            canvas.toBlob((blob) => {
              if (!blob) return reject(new Error('Error al comprimir la imagen.'));
              const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.webp`;
              resolve(new File([blob], fileName, { type: 'image/webp' }));
            }, 'image/webp', quality);
          };
          img.onerror = () => reject(new Error('No se pudo procesar la imagen seleccionada.'));
        };
        reader.onerror = () => reject(new Error('Error al leer el archivo del disco.'));
      });
    }

    // Publicar inmueble
    async function publicarInmueble(e) {
      e.preventDefault();
      if (!usuarioActual) return alert('Sesión expirada. Por favor recarga e inicia sesión.');

      const btn = document.getElementById('btnSubmit');
      const inputFiles = document.getElementById('inputFotos').files;
      const files = Array.from(inputFiles).slice(0, 5);

      if (files.length === 0) return alert('Por favor selecciona al menos 1 imagen.');

      btn.disabled = true;
      const fotosUrls = [];

      try {
        // Step 1: Compresión y Carga de Fotos
        for (let i = 0; i < files.length; i++) {
          btn.textContent = `⏳ Comprimiendo imagen ${i + 1} de ${files.length}...`;
          const comprimido = await comprimirImagenWebP(files[i]);
          
          btn.textContent = `⏳ Subiendo imagen ${i + 1} de ${files.length}...`;
          const storagePath = `${usuarioActual.id}/${comprimido.name}`;
          
          const { error: storageError } = await db.storage
            .from('fotos-inmuebles')
            .upload(storagePath, comprimido, { cacheControl: '3600', upsert: false });

          if (storageError) throw new Error(`Error en storage: ${storageError.message}`);

          const { data: publicUrlData } = db.storage
            .from('fotos-inmuebles')
            .getPublicUrl(storagePath);

          fotosUrls.push(publicUrlData.publicUrl);
        }

        // Step 2: Inserción en Base de Datos
        btn.textContent = "⏳ Registrando inmueble...";
        const payload = {
          user_id: usuarioActual.id,
          titulo: document.getElementById('titulo').value.trim(),
          precio: parseFloat(document.getElementById('precio').value),
          tipo_operacion: document.getElementById('tipo_operacion').value,
          ubicacion: document.getElementById('ubicacion').value.trim(),
          habitaciones: parseInt(document.getElementById('habitaciones').value) || 0,
          banos: parseInt(document.getElementById('banos').value) || 0,
          estacionamientos: parseInt(document.getElementById('estacionamientos').value) || 0,
          codigo: `ECO-${Math.floor(100000 + Math.random() * 900000)}`,
          fotos: fotosUrls,
          estado: 'activo'
        };

        const { error: dbError } = await db.from('inmuebles').insert([payload]);
        if (dbError) throw dbError;

        document.getElementById('formInmueble').reset();
        await cargarMisInmuebles();
        alert('¡Inmueble publicado exitosamente!');

      } catch (err) {
        console.error('Error durante la publicación:', err);
        alert('Ocurrió un error: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "📤 Comprimir, Subir y Publicar";
      }
    }

    // Cargar Inmuebles del Agente Autenticado (Protegido por RLS)
    async function cargarMisInmuebles() {
      const container = document.getElementById('listaMisInmuebles');
      container.innerHTML = `<div class="text-center py-6 text-slate-500 text-xs">Cargando mis propiedades...</div>`;

      try {
        const { data, error } = await db.from('inmuebles')
          .select('id, codigo, titulo, precio, estado, created_at')
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          container.innerHTML = `<p class="text-center py-6 text-slate-500 text-xs">No tienes inmuebles activos registrados.</p>`;
          return;
        }

        container.innerHTML = data.map(item => `
          <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4 hover:border-slate-700 transition">
            <div class="text-center md:text-left space-y-0.5">
              <span class="font-mono font-bold text-emerald-400 text-xs">${escapeHTML(item.codigo)}</span>
              <h4 class="text-sm font-semibold text-slate-200 line-clamp-1">${escapeHTML(item.titulo)}</h4>
              <p class="text-xs text-slate-400 font-medium">$${Number(item.precio || 0).toLocaleString()}</p>
            </div>
            <button data-id="${item.id}" class="btn-borrar bg-red-500/10 text-red-400 border border-red-500/20 text-xs px-4 py-2 rounded-lg hover:bg-red-500/20 transition active:scale-95 flex items-center gap-1">
              🗑️ Borrar
            </button>
          </div>
        `).join('');

        // Delegación de eventos para botones de borrado seguros
        document.querySelectorAll('.btn-borrar').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = e.currentTarget.getAttribute('data-id');
            borrarInmueble(id);
          });
        });

      } catch (err) {
        console.error('Error al cargar inmuebles:', err.message);
        container.innerHTML = `<p class="text-center py-4 text-red-400 text-xs">Error al consultar datos: ${escapeHTML(err.message)}</p>`;
      }
    }

    // Borrado seguro (RLS valida que el registro le pertenezca al usuario)
    async function borrarInmueble(id) {
      if (!confirm('¿Seguro que deseas eliminar este inmueble permanentemente?')) return;
      
      try {
        const { error } = await db.from('inmuebles').delete().eq('id', id);
        if (error) throw error;
        await cargarMisInmuebles();
      } catch (err) {
        alert('Error al eliminar: ' + err.message);
      }
    }

    // Control de Estado de Autenticación
    async function initAuth() {
      const { data: { session } } = await db.auth.getSession();
      
      const updateUI = (sess) => {
        if (sess) {
          usuarioActual = sess.user;
          document.getElementById('modalAuth').classList.add('hidden');
          const userInfo = document.getElementById('userInfo');
          userInfo.textContent = usuarioActual.email;
          userInfo.classList.remove('hidden');
          document.getElementById('btnCerrarSesion').classList.remove('hidden');
          cargarMisInmuebles();
        } else {
          usuarioActual = null;
          document.getElementById('modalAuth').classList.remove('hidden');
          document.getElementById('userInfo').classList.add('hidden');
          document.getElementById('btnCerrarSesion').classList.add('hidden');
        }
      };

      updateUI(session);

      db.auth.onAuthStateChange((_event, session) => {
        updateUI(session);
      });
    }

    // Event Listeners decoupled del HTML
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('btnGoogleLogin').addEventListener('click', loginGoogle);
      document.getElementById('btnCerrarSesion').addEventListener('click', logout);
      document.getElementById('formInmueble').addEventListener('submit', publicarInmueble);

      initAuth();
    });
  </script>
</body>
</html>
