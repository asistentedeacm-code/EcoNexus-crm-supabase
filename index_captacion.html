<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoNexus - Panel Agentes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  <!-- Autenticación Segura -->
  <div id="modalAuth" class="fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-8 shadow-2xl text-center space-y-6">
      <h2 class="text-3xl font-black text-emerald-400">EcoNexus</h2>
      <p class="text-xs text-slate-400">Panel Exclusivo de Agentes Autenticados</p>
      <button onclick="loginGoogle()" class="w-full bg-white hover:bg-slate-200 text-slate-900 font-bold py-3 px-4 rounded-xl transition flex items-center justify-center gap-3 text-sm">
        Continuar con Google
      </button>
    </div>
  </div>

  <header class="border-b border-slate-800 bg-slate-900 p-4 sticky top-0 z-40">
    <div class="max-w-5xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-black text-emerald-400">EcoNexus <span class="text-xs font-normal text-slate-400">| Agentes</span></h1>
      <div class="flex items-center gap-4">
        <span id="userInfo" class="text-xs text-slate-400 hidden"></span>
        <button id="btnCerrarSesion" onclick="logout()" class="hidden text-xs bg-red-500/10 text-red-400 hover:bg-red-500/20 px-3 py-1.5 rounded-lg transition">Salir</button>
        <a href="index.html" class="text-xs text-slate-400 hover:text-emerald-400 transition">← Catálogo</a>
      </div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-4 space-y-8 mt-4">
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
      <h2 class="text-xl font-bold mb-4">Publicar Inmueble (Ahorro Ancho de Banda)</h2>
      <form id="formInmueble" class="space-y-4">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <input type="text" id="titulo" placeholder="Título *" required class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
          <input type="number" id="precio" placeholder="Precio ($ USD) *" required class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <select id="tipo_operacion" required class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
            <option value="Venta">Venta</option>
            <option value="Alquiler">Alquiler</option>
          </select>
          <input type="text" id="ubicacion" placeholder="Ubicación *" required class="bg-slate-950 border border-slate-800 rounded-xl p-3 text-sm outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Fotos (Máximo 5 - Se comprimirán automáticamente a WebP para $0 USD)</label>
          <input type="file" id="inputFotos" accept="image/*" multiple required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-2 text-xs text-slate-400">
        </div>
        <button type="submit" id="btnSubmit" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold py-3 rounded-xl transition">📤 Comprimir, Guardar e Insertar</button>
      </form>
    </section>

    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
      <h3 class="text-lg font-bold">Mis Propiedades (Control RLS)</h3>
      <div id="listaMisInmuebles" class="space-y-3">
        <div class="text-center py-6 text-slate-500 text-sm">Verificando seguridad...</div>
      </div>
    </section>
  </main>

  <script>
    const supabase = window.supabase.createClient('https://gvcklmqldswxfweliuio.supabase.co', 'sb_publishable_Yu3I-FpcjU44dHsPs9pPDQ_9TEC9fKa');
    let usuarioActual = null;

    async function loginGoogle() { await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href }}); }
    async function logout() { await supabase.auth.signOut(); window.location.reload(); }

    supabase.auth.onAuthStateChange((_, session) => {
      if (session) {
        usuarioActual = session.user;
        document.getElementById('modalAuth').classList.add('hidden');
        document.getElementById('userInfo').textContent = usuarioActual.email;
        document.getElementById('userInfo').classList.remove('hidden');
        document.getElementById('btnCerrarSesion').classList.remove('hidden');
        cargarMisInmuebles();
      } else {
        document.getElementById('modalAuth').classList.remove('hidden');
      }
    });

    // Motor de compresión a WebP (Reduce tamaño un 80% sin perder calidad visual)
    async function comprimirImagenWebP(file, maxWidth = 1000) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let w = img.width, h = img.height;
            if (w > maxWidth) { h = Math.round((h * maxWidth) / w); w = maxWidth; }
            canvas.width = w; canvas.height = h;
            canvas.getContext('2d').drawImage(img, 0, 0, w, h);
            canvas.toBlob((blob) => resolve(new File([blob], `${Date.now()}.webp`, { type: 'image/webp' })), 'image/webp', 0.80);
          };
        };
      });
    }

    document.getElementById('formInmueble').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true; btn.textContent = "⏳ Comprimiendo y Subiendo (Ahorrando espacio)...";
      
      try {
        const files = Array.from(document.getElementById('inputFotos').files).slice(0, 5);
        const fotosUrls = [];
        
        for (const file of files) {
          const comprimido = await comprimirImagenWebP(file);
          const name = `${usuarioActual.id}/${Date.now()}_${Math.random().toString(36).substring(7)}.webp`;
          const { error: storageError } = await supabase.storage.from('fotos-inmuebles').upload(name, comprimido);
          if (!storageError) {
            const { data } = supabase.storage.from('fotos-inmuebles').getPublicUrl(name);
            fotosUrls.push(data.publicUrl);
          }
        }

        const payload = {
          user_id: usuarioActual.id,
          titulo: document.getElementById('titulo').value,
          precio: parseFloat(document.getElementById('precio').value),
          tipo_operacion: document.getElementById('tipo_operacion').value,
          ubicacion: document.getElementById('ubicacion').value,
          codigo: `ECO-${Math.floor(100000 + Math.random() * 900000)}`,
          fotos: fotosUrls,
          estado: 'activo'
        };

        const { error } = await supabase.from('inmuebles').insert([payload]);
        if (error) throw error;
        
        document.getElementById('formInmueble').reset();
        cargarMisInmuebles();
        alert("¡Inmueble publicado exitosamente!");
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.disabled = false; btn.textContent = "📤 Comprimir, Guardar e Insertar";
      }
    });

    async function cargarMisInmuebles() {
      // Gracias a RLS en Supabase, esta consulta SOLO traerá los inmuebles de este usuario
      const { data, error } = await supabase.from('inmuebles')
        .select('id, codigo, titulo, precio, estado, created_at')
        .order('created_at', { ascending: false });
        
      const cont = document.getElementById('listaMisInmuebles');
      if (error || !data || data.length === 0) {
        return cont.innerHTML = `<p class="text-center py-6 text-slate-500 text-xs">No tienes inmuebles activos.</p>`;
      }
      
      cont.innerHTML = data.map(item => `
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
          <div class="text-center md:text-left">
            <span class="font-bold text-emerald-400 text-xs">${item.codigo}</span>
            <h4 class="text-sm font-semibold">${item.titulo}</h4>
            <p class="text-xs text-slate-500">$${Number(item.precio).toLocaleString()}</p>
          </div>
          <button onclick="borrarInmueble('${item.id}')" class="bg-red-500/10 text-red-400 border border-red-500/20 text-xs px-4 py-2 rounded-lg hover:bg-red-500/20 transition">🗑️ Borrar</button>
        </div>
      `).join('');
    }

    async function borrarInmueble(id) {
      if(!confirm('¿Seguro que deseas eliminar este inmueble?')) return;
      const { error } = await supabase.from('inmuebles').delete().eq('id', id);
      if(error) alert('Error: ' + error.message);
      else cargarMisInmuebles();
    }
  </script>
</body>
</html>
