<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoNexus - Admin Central</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans">
  
  <div id="authGate" class="fixed inset-0 bg-slate-950 z-[100] flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-amber-500/30 p-8 rounded-2xl max-w-sm w-full shadow-2xl text-center space-y-5">
      <div class="w-14 h-14 bg-amber-500/10 border border-amber-500/20 text-amber-400 rounded-2xl flex items-center justify-center text-2xl mx-auto">👑</div>
      <h2 class="text-xl font-bold">Panel Admin EcoNexus</h2>
      <p class="text-xs text-slate-400">Acceso protegido mediante RLS y Roles en PostgreSQL.</p>
      <button onclick="loginGoogle()" class="w-full bg-white hover:bg-slate-200 text-slate-900 font-bold py-3 rounded-xl transition text-sm">
        Iniciar Sesión con Google
      </button>
      <p id="msgError" class="text-xs text-red-400 hidden p-2 bg-red-500/10 rounded-lg border border-red-500/20"></p>
    </div>
  </div>

  <header class="border-b border-slate-800 bg-slate-900 p-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-lg font-black text-amber-400">👑 EcoNexus Admin</h1>
      <button onclick="logout()" class="text-xs text-red-400 hover:underline">🔒 Cerrar Sesión</button>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 space-y-6 mt-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl space-y-4">
      <div class="flex flex-col md:flex-row justify-between items-center gap-4">
        <h2 class="text-xl font-bold">Control General (Superusuario)</h2>
        <input type="text" id="buscadorAdmin" oninput="buscarServerSide()" placeholder="🔍 Buscar por código o título..." class="w-full md:w-80 bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs outline-none focus:border-amber-400">
      </div>
      
      <div id="tablaInmueblesAdmin" class="space-y-3">
        <div class="text-center py-8 text-slate-500 text-sm">Validando tu Rango (Role)...</div>
      </div>

      <div class="flex justify-between items-center pt-4 border-t border-slate-800 text-xs text-slate-400 font-bold">
        <button id="btnPrev" onclick="cambiarPagina(-1)" class="px-4 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition disabled:opacity-50" disabled>Anterior</button>
        <span id="labelPagina">Página 1</span>
        <button id="btnNext" onclick="cambiarPagina(1)" class="px-4 py-2 bg-slate-800 rounded-lg hover:bg-slate-700 transition">Siguiente</button>
      </div>
    </div>
  </main>

  <script>
    const supabase = window.supabase.createClient('https://gvcklmqldswxfweliuio.supabase.co', 'sb_publishable_Yu3I-FpcjU44dHsPs9pPDQ_9TEC9fKa');
    let paginaActual = 0;
    const LIMITE = 15;
    let timerDebounce;

    async function loginGoogle() { await supabase.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: window.location.href } }); }
    async function logout() { await supabase.auth.signOut(); window.location.reload(); }

    async function verificarAdmin() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      const { data: profile } = await supabase.from('profiles').select('role').eq('id', session.user.id).single();
      
      if (!profile || profile.role !== 'admin') {
        const msg = document.getElementById('msgError');
        msg.textContent = '⛔ Acceso denegado: Base de datos informa que tu cuenta es Rango "agente", no "admin".';
        msg.classList.remove('hidden');
        await supabase.auth.signOut();
        return;
      }
      
      document.getElementById('authGate').classList.add('hidden');
      cargarInmueblesPaginados();
    }

    async function cargarInmueblesPaginados() {
      const queryBusqueda = document.getElementById('buscadorAdmin').value.trim();
      const from = paginaActual * LIMITE;
      const to = from + LIMITE - 1;

      let consulta = supabase.from('inmuebles')
        .select('id, codigo, titulo, precio, es_vip, es_verificado', { count: 'exact' })
        .range(from, to).order('created_at', { ascending: false });

      if (queryBusqueda) consulta = consulta.ilike('titulo', `%${queryBusqueda}%`);

      const { data, count, error } = await consulta;
      if (error) return document.getElementById('tablaInmueblesAdmin').innerHTML = `<p class="text-red-400">Error: ${error.message}</p>`;
      
      renderizarTabla(data || []);
      actualizarPaginacion(count || 0);
    }

    function renderizarTabla(items) {
      const cont = document.getElementById('tablaInmueblesAdmin');
      if (items.length === 0) return cont.innerHTML = `<p class="text-center py-6 text-slate-500">No hay datos.</p>`;
      
      cont.innerHTML = items.map(i => `
        <div class="bg-slate-950 border border-slate-800 p-4 rounded-xl flex flex-col md:flex-row justify-between items-center gap-4">
          <div class="text-center md:text-left">
            <div class="flex items-center gap-2 justify-center md:justify-start">
                <span class="font-bold text-emerald-400 text-sm">${i.codigo}</span>
                ${i.es_vip ? '<span class="bg-amber-400 text-slate-950 font-black px-2 py-0.5 rounded text-[10px]">VIP</span>' : ''}
                ${i.es_verificado ? '<span class="bg-blue-500 text-white font-bold px-2 py-0.5 rounded text-[10px]">VERIFICADO</span>' : ''}
            </div>
            <h4 class="text-sm font-semibold text-slate-200 mt-1">${i.titulo}</h4>
            <p class="text-xs text-slate-500">$${Number(i.precio).toLocaleString()}</p>
          </div>
          <div class="flex items-center gap-2 flex-wrap justify-center">
            <button onclick="toggleAction('${i.id}', 'es_vip', ${!i.es_vip})" class="bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs px-3 py-2 rounded-lg font-bold">${i.es_vip ? 'Quitar VIP' : 'Dar VIP'}</button>
            <button onclick="toggleAction('${i.id}', 'es_verificado', ${!i.es_verificado})" class="bg-blue-500/10 text-blue-400 border border-blue-500/20 text-xs px-3 py-2 rounded-lg font-bold">${i.es_verificado ? 'Quitar Check' : 'Verificar'}</button>
            <button onclick="eliminarAccion('${i.id}')" class="bg-red-500/10 text-red-400 hover:bg-red-500/30 text-xs px-3 py-2 rounded-lg font-bold">🗑️ Borrar</button>
          </div>
        </div>
      `).join('');
    }

    async function toggleAction(id, campo, valor) {
      await supabase.from('inmuebles').update({ [campo]: valor }).eq('id', id);
      cargarInmueblesPaginados();
    }

    async function eliminarAccion(id) {
      if (!confirm('¿Eliminar registro permanentemente (Bypass de Admin)?')) return;
      await supabase.from('inmuebles').delete().eq('id', id);
      cargarInmueblesPaginados();
    }

    function actualizarPaginacion(totalCount) {
      document.getElementById('btnPrev').disabled = paginaActual === 0;
      document.getElementById('btnNext').disabled = (paginaActual + 1) * LIMITE >= totalCount;
      document.getElementById('labelPagina').textContent = `Página ${paginaActual + 1} de ${Math.ceil(totalCount / LIMITE) || 1}`;
    }

    function cambiarPagina(delta) { paginaActual += delta; cargarInmueblesPaginados(); }
    function buscarServerSide() { clearTimeout(timerDebounce); timerDebounce = setTimeout(() => { paginaActual = 0; cargarInmueblesPaginados(); }, 300); }

    supabase.auth.onAuthStateChange(() => verificarAdmin());
    verificarAdmin();
  </script>
</body>
</html>
