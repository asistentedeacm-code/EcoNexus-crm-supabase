<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EcoNexus - Marketplace Inmobiliario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 p-4">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <h1 class="text-2xl font-black text-emerald-400 tracking-tight">EcoNexus</h1>
        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold px-2 py-0.5 rounded-full">Pro</span>
      </div>
      <a href="index_captacion.html" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold px-4 py-2.5 rounded-xl transition-all shadow-lg shadow-emerald-500/10 active:scale-95 flex items-center gap-1">
        <span>➕</span> Panel Agente
      </a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-7xl mx-auto p-4 md:p-8 space-y-6">
    <!-- Buscador & Filtros -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 md:p-6 shadow-xl">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="md:col-span-3">
          <label for="inputBusqueda" class="block text-xs font-semibold text-slate-400 mb-1">Buscador Inteligente</label>
          <input type="text" id="inputBusqueda" placeholder="Buscar por título, ubicación o código..." class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200 text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
        </div>
        <div>
          <label for="selectOperacion" class="block text-xs font-semibold text-slate-400 mb-1">Operación</label>
          <select id="selectOperacion" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-200 text-sm outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition cursor-pointer">
            <option value="Todos">Todas las operaciones</option>
            <option value="Venta">Venta</option>
            <option value="Alquiler">Alquiler</option>
          </select>
        </div>
      </div>
    </section>

    <!-- Grid de Inmuebles -->
    <div id="gridInmuebles" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <!-- Skeletons renderizados automáticamente antes de la carga -->
    </div>

    <!-- Controles de Paginación Server-Side -->
    <div class="flex justify-between items-center pt-4 text-xs font-bold text-slate-400 border-t border-slate-800/60">
      <button id="btnPrev" class="px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800 hover:text-slate-200 transition active:scale-95" disabled>
        ← Anterior
      </button>
      <span id="labelPagina" class="bg-slate-900 px-3 py-1.5 rounded-lg border border-slate-800 text-slate-300">Página 1</span>
      <button id="btnNext" class="px-4 py-2.5 bg-slate-900 border border-slate-800 rounded-xl disabled:opacity-40 disabled:cursor-not-allowed hover:bg-slate-800 hover:text-slate-200 transition active:scale-95">
        Siguiente →
      </button>
    </div>
  </main>

  <script>
    // Inicialización del cliente Supabase
    const SUPABASE_URL = 'https://gvcklmqldswxfweliuio.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_Yu3I-FpcjU44dHsPs9pPDQ_9TEC9fKa';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Estado local
    let paginaActual = 0;
    const LIMITE = 12;
    let timerDebounce = null;
    const fallbackImg = 'https://images.unsplash.com/photo-1560518883-ce09059eeffa?q=80&w=600&auto=format&fit=crop';

    // Helper Anti-XSS (Sanitización básica)
    function escapeHTML(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, match => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[match]);
    }

    // Renderizado de Skeleton Loaders
    function mostrarSkeletons() {
      const container = document.getElementById('gridInmuebles');
      container.innerHTML = Array(6).fill(0).map(() => `
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden animate-pulse flex flex-col h-96">
          <div class="h-56 bg-slate-800"></div>
          <div class="p-5 flex-1 flex flex-col justify-between space-y-3">
            <div class="space-y-2">
              <div class="h-3 bg-slate-800 rounded w-1/4"></div>
              <div class="h-5 bg-slate-800 rounded w-3/4"></div>
              <div class="h-3 bg-slate-800 rounded w-1/2"></div>
            </div>
            <div class="h-4 bg-slate-800 rounded w-full pt-3"></div>
          </div>
        </div>
      `).join('');
    }

    // Carga de catálogo Server-Side
    async function cargarCatalogoServerSide() {
      mostrarSkeletons();

      const query = document.getElementById('inputBusqueda').value.trim();
      const operacion = document.getElementById('selectOperacion').value;
      const from = paginaActual * LIMITE;
      const to = from + LIMITE - 1;

      try {
        let consulta = db.from('inmuebles')
          .select('id, codigo, titulo, precio, ubicacion, tipo_operacion, fotos, es_vip, es_verificado, habitaciones, banos, estacionamientos', { count: 'exact' })
          .eq('estado', 'activo')
          .range(from, to)
          .order('es_vip', { ascending: false })
          .order('created_at', { ascending: false });

        if (operacion !== 'Todos') {
          consulta = consulta.eq('tipo_operacion', operacion);
        }

        if (query) {
          const cleanQuery = query.replace(/[%_]/g, '');
          consulta = consulta.or(`titulo.ilike.%${cleanQuery}%,ubicacion.ilike.%${cleanQuery}%,codigo.ilike.%${cleanQuery}%`);
        }

        const { data, count, error } = await consulta;

        if (error) throw error;

        renderizarGrid(data || []);
        actualizarPaginacion(count || 0);

      } catch (err) {
        console.error('Error al consultar catálogo:', err.message);
        document.getElementById('gridInmuebles').innerHTML = `
          <div class="col-span-full text-center py-12 bg-red-950/20 border border-red-900/50 rounded-2xl p-6 text-red-400">
            ⚠️ Error al cargar las propiedades: ${escapeHTML(err.message)}
          </div>`;
      }
    }

    // Renderizado seguro en el DOM
    function renderizarGrid(lista) {
      const container = document.getElementById('gridInmuebles');
      if (lista.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-900/50 border border-slate-800 rounded-2xl text-slate-500">
            <p class="text-3xl mb-2">🔍</p>
            <p class="text-sm font-semibold">No se encontraron inmuebles disponibles.</p>
          </div>`;
        return;
      }

      container.innerHTML = lista.map(item => {
        const foto = (Array.isArray(item.fotos) && item.fotos.length > 0 && item.fotos[0]) 
          ? escapeHTML(item.fotos[0]) 
          : fallbackImg;

        return `
          <article class="bg-slate-900 border ${item.es_vip ? 'border-amber-500/50 shadow-amber-500/10 shadow-lg' : 'border-slate-800'} rounded-2xl overflow-hidden hover:border-slate-700 transition flex flex-col group">
            <div class="relative h-56 bg-slate-800 overflow-hidden">
              <img src="${foto}" 
                   alt="${escapeHTML(item.titulo)}" 
                   loading="lazy" 
                   onerror="this.onerror=null; this.src='${fallbackImg}';"
                   class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
              <div class="absolute top-3 left-3 flex gap-2 flex-wrap">
                <span class="bg-slate-950/80 backdrop-blur-md text-emerald-400 font-bold px-2.5 py-1 rounded-lg text-xs border border-slate-700/80">
                  ${escapeHTML(item.tipo_operacion)}
                </span>
                ${item.es_vip ? '<span class="bg-amber-400 text-slate-950 font-black px-2 py-1 rounded-lg text-xs shadow-lg">⭐ VIP</span>' : ''}
                ${item.es_verificado ? '<span class="bg-blue-500 text-white font-bold px-2 py-1 rounded-lg text-xs shadow-lg">✓ Verificado</span>' : ''}
              </div>
              <span class="absolute top-3 right-3 bg-emerald-500 text-slate-950 font-black px-3 py-1.5 rounded-xl text-sm shadow-md">
                $${Number(item.precio || 0).toLocaleString()}
              </span>
            </div>
            <div class="p-5 flex-1 flex flex-col justify-between">
              <div>
                <div class="text-[10px] font-mono text-slate-500 mb-1">CÓD: ${escapeHTML(item.codigo || 'N/A')}</div>
                <h3 class="font-bold text-base text-slate-100 line-clamp-1 group-hover:text-emerald-400 transition" title="${escapeHTML(item.titulo)}">
                  ${escapeHTML(item.titulo)}
                </h3>
                <p class="text-slate-400 text-xs mt-1 line-clamp-1">📍 ${escapeHTML(item.ubicacion)}</p>
              </div>
              <div class="flex justify-between text-xs font-semibold text-slate-400 mt-4 border-t border-slate-800/80 pt-3">
                <span>🛏️ ${Number(item.habitaciones || 0)}</span>
                <span>🚿 ${Number(item.banos || 0)}</span>
                <span>🚗 ${Number(item.estacionamientos || 0)}</span>
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    // Actualizar paginación
    function actualizarPaginacion(total) {
      const btnPrev = document.getElementById('btnPrev');
      const btnNext = document.getElementById('btnNext');
      const totalPaginas = Math.ceil(total / LIMITE) || 1;

      btnPrev.disabled = paginaActual === 0;
      btnNext.disabled = (paginaActual + 1) * LIMITE >= total;
      document.getElementById('labelPagina').textContent = `Página ${paginaActual + 1} de ${totalPaginas}`;
    }

    function cambiarPagina(delta) { 
      paginaActual += delta; 
      cargarCatalogoServerSide(); 
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buscarServerSide() { 
      clearTimeout(timerDebounce); 
      timerDebounce = setTimeout(() => { 
        paginaActual = 0; 
        cargarCatalogoServerSide(); 
      }, 300); 
    }

    // Inicialización al cargar el DOM
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('inputBusqueda').addEventListener('input', buscarServerSide);
      document.getElementById('selectOperacion').addEventListener('change', () => {
        paginaActual = 0;
        cargarCatalogoServerSide();
      });
      document.getElementById('btnPrev').addEventListener('click', () => cambiarPagina(-1));
      document.getElementById('btnNext').addEventListener('click', () => cambiarPagina(1));

      cargarCatalogoServerSide();
    });
  </script>
</body>
</html>
